<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="vinylGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#222222"/>
      <stop offset="35%" stop-color="#141414"/>
      <stop offset="60%" stop-color="#2a2a2a"/>
      <stop offset="85%" stop-color="#0f0f0f"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <radialGradient id="centerGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0f0f0"/>
      <stop offset="70%" stop-color="#cccccc"/>
      <stop offset="100%" stop-color="#888888"/>
    </radialGradient>
  </defs>
  
  <!-- Outer Vinyl / CD Disc -->
  <circle cx="100" cy="100" r="98" fill="url(#vinylGrad)" stroke="#383838" stroke-width="2"/>
  
  <!-- Grooves -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <circle cx="100" cy="100" r="72" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <circle cx="100" cy="100" r="64" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <circle cx="100" cy="100" r="56" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <circle cx="100" cy="100" r="48" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  
  <!-- CD Sheen Reflections -->
  <path d="M100 100 L35 35 A92 92 0 0 1 100 8 Z" fill="rgba(255,255,255,0.06)"/>
  <path d="M100 100 L165 165 A92 92 0 0 1 100 192 Z" fill="rgba(255,255,255,0.06)"/>

  <!-- Center Retro Label -->
  <circle cx="100" cy="100" r="36" fill="#881337" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="33" fill="none" stroke="#f5c518" stroke-width="0.8" stroke-dasharray="3,2"/>
  
  <!-- Center Mirror Ring -->
  <circle cx="100" cy="100" r="20" fill="url(#centerGrad)" stroke="#444" stroke-width="1"/>
  
  <!-- Spindle Hole -->
  <circle cx="100" cy="100" r="8" fill="#000000" stroke="#999" stroke-width="1"/>
</svg>
